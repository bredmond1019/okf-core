[package]
name = "okf-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
typeshare = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
typeshare = ["dep:typeshare"]
