[package]
name = "okf-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.dev]
# Keep panic/backtrace line numbers; drop full DWARF type descriptions (biggest link-time cost).
debug = "line-tables-only"
# Skip macOS's dsymutil debug-info-bundling pass; leave debug info split across .o files instead.
split-debuginfo = "unpacked"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
typeshare = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
typeshare = ["dep:typeshare"]
